<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标讯助手 - Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .tag-green { background: #dcfce7; color: #166534; }
  .tag-yellow { background: #fef9c3; color: #854d0e; }
  .tag-blue { background: #dbeafe; color: #1e40af; }
  .tag-red { background: #fee2e2; color: #991b1b; }
  .tag-gray { background: #f3f4f6; color: #374151; }
  .tag-purple { background: #f3e8ff; color: #7e22ce; }
  .modal-bg { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
  .fade-in { animation: fadeIn 0.2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .sidebar-item:hover { background: #f3f4f6; }
  .sidebar-item.active { background: #eff6ff; color: #2563eb; }
  .sidebar-item.active svg { stroke: #2563eb; }
  .ann-row:hover { background: #f9fafb; }
</style>
</head>
<body class="bg-gray-50 text-gray-800">

<div id="app"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
