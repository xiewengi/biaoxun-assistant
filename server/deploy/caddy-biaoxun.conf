# =============================================================================
# 标讯助手 · Caddy 子路径路由片段
#
# 适用场景：服务器 80/443 已被现有站点（例如「A股每日涨幅榜」）的 Caddy 占用，
#           没有独立域名，需要把标讯助手挂在 https://<服务器IP>/biaoxun/ 下。
#
# 前提：
#   1. 标讯助手已由 systemd 启动，监听 127.0.0.1:8000（见 biaoxun.service）
#   2. 前端支持子路径：web/index.html 使用相对路径脚本，api.js 会自动推导
#      /biaoxun/api，无需改代码
#
# 使用方法（不要整文件覆盖现有 Caddyfile）：
#   1. 备份：sudo cp /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak.$(date +%F-%H%M)
#   2. 在已有站点的 { } 块内追加下面 handle_path 段（注意放在兜底规则之前）
#   3. 校验：sudo caddy validate --config /etc/caddy/Caddyfile
#   4. 生效：sudo systemctl reload caddy
#   5. 访问：https://<服务器IP>/biaoxun/  （自签证书会提示不安全，继续访问即可）
#
# 说明：
#   - route + uri strip_prefix 会剥掉 /biaoxun 前缀再转发，后端仍按 /api、/js 等根路径处理
#   - 访问 /biaoxun（不带斜杠）会 308 到 /biaoxun/，保证相对路径脚本正确解析
#   - 若现有站点用 `reverse_proxy` 或 `file_server` 兜底，本段必须写在兜底之前
# =============================================================================

# ---- 复制以下内容到现有 site 块内 ----
	# 标讯助手：https://<IP>/biaoxun/
	# 用 route 是为了确保排在现有站点的兜底 reverse_proxy / file_server 之前
	redir /biaoxun /biaoxun/ 308
	route /biaoxun/* {
		uri strip_prefix /biaoxun
		reverse_proxy 127.0.0.1:8000
	}
# ---- 复制结束 ----

# =============================================================================
# 可选：如果更喜欢独立端口（需要腾讯云安全组放行 8000），
# 可以完全不改现有站点，直接新增一个 site 块：
#
# :8000 {
#     reverse_proxy 127.0.0.1:8000
# }
#
# 但注意：这样是 HTTP 明文，且需要在安全组放行 8000。
# =============================================================================
