# =============================================================================
# 标讯助手 · Caddy 根路径配置（替换现有站点时使用）
#
# 适用：这台服务器上原来的「A股每日涨幅榜」不再需要，标讯助手独占 80/443。
# 由 deploy/switch-caddy-root.sh 自动安装；也可以手工复制到 /etc/caddy/Caddyfile。
#
# 访问：
#   HTTP  http://<服务器IP>/        （自动 308 跳 HTTPS）
#   HTTPS https://<服务器IP>/       （Caddy 自签证书，浏览器提示不安全 → 继续访问）
#
# 没有域名/备案，无法申请公信证书，所以用 Caddy internal CA。流量仍是加密的。
# 如果更在意“不弹证书警告”，把本文件换成纯 HTTP：
#   bash switch-caddy-root.sh --http-only
# =============================================================================

# 全局：IP 直接访问时浏览器不带 SNI，必须指定默认证书名，否则 TLS 握手失败
# __SITE_HOST__ 由 switch-caddy-root.sh --site-host 替换
{
	default_sni __SITE_HOST__
}

# HTTP：全部跳到 HTTPS
:80 {
	redir https://{host}{uri} permanent
}

# HTTPS：标讯助手（FastAPI 同时提供 API 与前端静态文件）
# __SITE_HOST__ 由 switch-caddy-root.sh --site-host 替换；手工使用时把整行改成 https://<你的IP>
https://__SITE_HOST__ {
	tls internal
	encode gzip
	reverse_proxy 127.0.0.1:8000 {
		header_up X-Forwarded-Proto {scheme}
		header_up X-Real-IP {remote_host}
	}
}
