# =============================================================================
# 标讯助手 · Nginx 站点配置
# 安装位置：/etc/nginx/conf.d/biaoxun.conf（deploy.sh 自动安装）
# 后端：uvicorn 127.0.0.1:8000（FastAPI 同时提供 /api/ 和静态前端）
#
# 注意：
#   - deploy.sh 会把 127.0.0.1:8000 替换成实际 --app-port，其余内容不动。
#   - 上线域名前把 server_name _; 改成你的域名。
#   - 大陆服务器 80/443 对外提供 Web 服务需要 ICP 备案（见 README）。
#   - 本文件末尾有 certbot 申请证书的说明；certbot --nginx 会改写本文件，
#     deploy.sh 检测到 "managed by Certbot" 时会跳过覆盖，避免破坏 HTTPS。
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;  # TODO: 有域名后改为 biaoxun.example.com www.biaoxun.example.com

    # 上传/请求体上限（与后端接口保持一致）
    client_max_body_size 10m;

    # -------------------------------------------------------------------------
    # 安全响应头（后端也会加同样的头，这里是第二道防线）
    # HSTS 只在启用 HTTPS 后再打开：add_header Strict-Transport-Security ...
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # 压缩（HTML/JS/CSS/JSON 等文本资源）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # API：反代到 FastAPI
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }

    # -------------------------------------------------------------------------
    # 前端：FastAPI StaticFiles 挂载在 /，因此同样反代到后端
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }

    # -------------------------------------------------------------------------
    # 静态资源缓存（可选）：不需要可整段删除。
    # 加了 1 小时缓存；更新前端后若浏览器仍用旧文件，可调小 expires 或清缓存。
    # 负向断言确保不会误伤 /api/ 下的路径。
    # -------------------------------------------------------------------------
    location ~* ^/(?!api/).+\.(css|js|mjs|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|map)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1h;  # 自动写入 Expires 与 Cache-Control: max-age=3600
    }
}

# =============================================================================
# HTTPS / 域名 / 证书（可选，域名解析与备案就绪后再启用）
#
# 1) 域名 A 记录指向本机公网 IP；大陆服务器先完成 ICP 备案。
# 2) 把上面的 server_name _; 改成实际域名。
# 3) 安装 certbot（二选一）：
#      Ubuntu/Debian: sudo apt-get install -y certbot python3-certbot-nginx
#      CentOS/RHEL:   sudo dnf install -y epel-release certbot python3-certbot-nginx
# 4) 申请证书（会自动改写本文件，添加 443 与 80->443 跳转）：
#      sudo certbot --nginx -d biaoxun.example.com -d www.biaoxun.example.com
# 5) 自动续期：
#      sudo systemctl enable --now certbot.timer
#      sudo certbot renew --dry-run
#
# 手工配置 443 的等价片段（如不用 certbot --nginx）：
#   listen 443 ssl http2;
#   ssl_certificate     /etc/letsencrypt/live/biaoxun.example.com/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/biaoxun.example.com/privkey.pem;
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_ciphers HIGH:!aNULL:!MD5;
# =============================================================================
